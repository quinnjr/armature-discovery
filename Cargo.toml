[package]
name = "armature-discovery"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/quinnjr/armature-discovery"
homepage.workspace = true
description = "Service discovery for Armature microservices"
keywords = ["discovery", "microservices", "consul", "etcd"]
categories = ["web-programming", "network-programming"]

[dependencies]
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0"
tracing = "0.1"
url = "2.5"
base64 = "0.22"
rand = "0.10"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
armature-testkit = { path = "../armature-testkit" }

